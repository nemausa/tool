# =========================
# Prefix: Ctrl-a
# =========================
set -g prefix C-b
bind C-b send-prefix
# =========================
# Basic
# =========================
set -g mouse on
set -g history-limit 50000
set -sg escape-time 500
set -g focus-events on
setw -g mode-keys vi

# 编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Forward extended keyboard sequences requested by applications such as Neovim.
set -s extended-keys on
set -s terminal-features[3] "xterm-256color:extkeys"

# =========================
# Pane navigation
# 使用 prefix + hjkl / 方向键切 pane，避免全局 Alt 快捷键和终端冲突
# =========================
unbind-key -n M-Up
unbind-key -n M-Down

bind H select-pane -L
bind L select-pane -R
bind K select-pane -U
bind J select-pane -D
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# =========================
# Window navigation
# prefix + w 按名字选标签，prefix + n/p 前后切换
# =========================
unbind-key -n F1
unbind-key -n F2
unbind-key -n F3
unbind-key -n F4
unbind-key -n F5
unbind-key -n F6
unbind-key -n F7
unbind-key -n F8
unbind-key -n F9
unbind-key -n S-F1
unbind-key -n S-F2
unbind-key -n M-q
unbind-key -n M-w
unbind-key -n M-e
unbind-key -n M-r
unbind-key -n M-t
unbind-key -n M-y
unbind-key -n M-u
unbind-key -n M-i
unbind-key -n M-o
unbind-key -n M-[
unbind-key -n M-]

bind h previous-window
bind l next-window
bind n next-window
bind p previous-window
bind w choose-tree -Zw
bind s choose-tree -Zs

bind-key -n M-Left previous-window
bind-key -n M-Right next-window
bind-key -n M-h previous-window
bind-key -n M-l next-window
bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# 添加/重命名顶部标签
bind T command-prompt -p "new tab name" "new-window -c '#{pane_current_path}' -n '%%'"
bind R command-prompt -p "rename tab" "rename-window '%%'"

# =========================
# Layouts
# =========================
bind = select-layout even-horizontal
bind | select-layout even-vertical
bind Space select-layout tiled

# 分屏继承当前目录
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# 新窗口继承当前目录
bind c new-window -c "#{pane_current_path}"

# 快速重载配置
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# =========================
# Status bar: 顶部项目标签栏
# =========================

set -g status on
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-position top
set -g status-interval 2
set -g status-justify centre
set -g status-left-length 18
set -g status-right-length 18

# 整体颜色：接近 Google 工具风格，克制、低噪音、只用一个蓝色强调当前标签
set -g status-style "bg=#0b1020,fg=#94a3b8"

# 左侧只放 session 名，避免把居中的标签挤歪
set -g status-left "#[bg=#0b1020,fg=#1a73e8,bold]  #S #[fg=#1f2937] "

# 右侧只留时间，不放机器名/路径等噪音
set -g status-right "#[fg=#1f2937] #[fg=#64748b]%H:%M  "

# 保留手动设置的标签名
setw -g automatic-rename off

# 普通标签：弱化，只作为导航
setw -g window-status-format "#[bg=#0b1020,fg=#64748b]  #I #[fg=#a8b3c7]#W  "

# 当前标签：单一蓝色高亮，像 IDE/Chrome 的 active tab
setw -g window-status-current-format "#[bg=#0b1020,fg=#1a73e8]#[bg=#1a73e8,fg=#f8fbff,bold] #I #W #[bg=#0b1020,fg=#1a73e8]"

# 窗口间距
setw -g window-status-separator " "

# 消息 / 复制模式
set -g message-style "bg=#111827,fg=#e5e7eb"
set -g mode-style "bg=#1a73e8,fg=#f8fbff,bold"

# Pane 边框
set -g pane-border-style "fg=#111827"
set -g pane-active-border-style "fg=#1a73e8"

# Clock
setw -g clock-mode-colour "#1a73e8"

# Persist tmux sessions across WSL/Windows restarts.
# Prefix + Ctrl-s saves; Prefix + Ctrl-r restores manually.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'off'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
