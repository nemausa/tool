# =========================
# Prefix: Ctrl-a
# =========================
set -g prefix C-b
bind C-b send-prefix
# =========================
# Basic
# =========================
set -g mouse on
set -g history-limit 50000
# Avoid a visible delay before forwarding Esc to terminal applications.
set -sg escape-time 0
set -g focus-events on
setw -g mode-keys vi

# 编号从 1 开始
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Forward extended keyboard sequences requested by applications such as Neovim.
set -s extended-keys on
set -s terminal-features[3] "xterm-256color:extkeys"

# =========================
# Pane navigation
# Alt + hjkl 无需 prefix 切 pane；同时保留 prefix + HJKL / 方向键。
# =========================
unbind-key -n M-Left
unbind-key -n M-Down
unbind-key -n M-Up
unbind-key -n M-Right

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind H select-pane -L
bind L select-pane -R
bind K select-pane -U
bind J select-pane -D
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# =========================
# Window navigation
# prefix + w 按名字选标签，prefix + n/p 前后切换
# =========================
unbind-key -n F1
unbind-key -n F2
unbind-key -n F3
unbind-key -n F4
unbind-key -n F5
unbind-key -n F6
unbind-key -n F7
unbind-key -n F8
unbind-key -n F9
unbind-key -n S-F1
unbind-key -n S-F2
unbind-key -n M-q
unbind-key -n M-w
unbind-key -n M-e
unbind-key -n M-r
unbind-key -n M-t
unbind-key -n M-y
unbind-key -n M-u
unbind-key -n M-i
unbind-key -n M-o
unbind-key -n M-[
unbind-key -n M-]

bind h previous-window
bind l next-window
bind n next-window
bind p previous-window
bind w choose-tree -Zw
bind s choose-tree -Zs

bind-key -n M-H previous-window
bind-key -n M-L next-window
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# 添加/重命名顶部标签
bind T command-prompt -p "new tab name" "new-window -c '#{pane_current_path}' -n '%%'"
bind R command-prompt -p "rename tab" "rename-window '%%'"

# =========================
# Layouts
# =========================
bind = select-layout even-horizontal
bind | select-layout even-vertical
bind Space select-layout tiled

# 分屏继承当前目录
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新窗口继承当前目录
bind c new-window -c "#{pane_current_path}"

# 快速重载配置
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# =========================
# Status bar: 顶部项目标签栏
# =========================

set -g status on
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-position top
set -g status-interval 2
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 60

# 配色对齐 gpakosz/.tmux 默认主题 (colour_1 底色 + colour_3 前景)
set -g status-style "bg=#080808,fg=#8a8a8a"

# 左侧：session 名 + tmux 运行时长，用 gpakosz 默认黄/粉分段配色 (colour_9 / colour_10)
set -g status-left "#[bg=#ffff00,fg=#080808,bold]  #S #[bg=#ff00af,fg=#e4e4e4,none] ↑#{?uptime_y, #{uptime_y}y,}#{?uptime_d, #{uptime_d}d,}#{?uptime_h, #{uptime_h}h,}#{?uptime_m, #{uptime_m}m,} #[bg=#080808,fg=#8a8a8a,none]"

# 右侧：同步提示 + prefix 指示器 + 时间 + 日期 + git 分支 | 用户名 | 主机名
set -g status-right "#{?pane_synchronized,#[bg=#d70000]#[fg=#e4e4e4]#[bold]  SYNC ,}#[bg=#080808,fg=#8a8a8a,none] #{?client_prefix,#[bg=#00afff]#[fg=#080808]#[bold] PREFIX #[bg=#080808]#[fg=#8a8a8a] | ,}%H:%M | %d %b #[bg=#d70000,fg=#e4e4e4,none] #(whoami) #[bg=#e4e4e4,fg=#080808,bold] #H "
# 保留手动设置的标签名
setw -g automatic-rename off

# 普通标签：colour_1 底色 + colour_3 前景
setw -g window-status-format "#[bg=#080808,fg=#8a8a8a]  #I #W  "

# 当前标签：colour_4 高亮 + 圆角胶囊，对齐 gpakosz 的 active window 配色；zoom 时追加 🔍
setw -g window-status-current-format "#[bg=#080808,fg=#00afff]#[bg=#00afff,fg=#080808,bold] #I #W#{?window_zoomed_flag, 🔍,} #[bg=#080808,fg=#00afff]"

# 窗口间距
setw -g window-status-separator " "

# 消息 / 复制模式：colour_5 (黄)
set -g message-style "bg=#ffff00,fg=#080808,bold"
set -g mode-style "bg=#ffff00,fg=#080808,bold"

# Pane 边框：colour_2 / colour_4，边框标题显示 index/命令/目录
set -g pane-border-status top
set -g pane-border-format " #[fg=#8a8a8a]#{pane_index} #[fg=#e4e4e4]#{pane_current_command} #[fg=#585858]#{b:pane_current_path} "
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#00afff"

# Popup / 菜单圆角边框，配色对齐 accent
set -g popup-border-lines rounded
set -g popup-border-style "fg=#00afff"
set -g menu-border-lines rounded
set -g menu-border-style "fg=#00afff"
set -g menu-style "bg=#080808,fg=#8a8a8a"
set -g menu-selected-style "bg=#00afff,fg=#080808,bold"

# Clock
setw -g clock-mode-colour "#00afff"

# Persist tmux sessions across WSL/Windows restarts.
# Prefix + Ctrl-s saves; Prefix + Ctrl-r restores manually.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '10'
set -g @continuum-restore 'off'
if-shell "test -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
  "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f ~/.tmux/plugins/tmux-continuum/continuum.tmux" \
  "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"
